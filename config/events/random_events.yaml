events:
  - id: mysterious_merchant
    name: "神秘商人"
    description: "你遇到了一位蒙面商人，他愿意以不寻常的价格交易。"
    choices:
      - text: "花费50金币购买随机遗物"
        condition: "gold >= 50"
        outcome:
          gold: -50
          reward: random_relic
      - text: "付出10点生命换取100金币"
        condition: "hp > 10"
        outcome:
          hp_cost: 10
          gold: 100
      - text: "离开"
        outcome: null

  - id: ancient_altar
    name: "古老祭坛"
    description: "一座散发神秘光芒的祭坛，似乎在等待祭品。"
    choices:
      - text: "献上30%最大生命值，获得传说遗物"
        outcome:
          hp_percent_cost: 0.3
          reward: legendary_relic
      - text: "献上100金币，获得史诗遗物"
        condition: "gold >= 100"
        outcome:
          gold: -100
          reward: epic_relic
      - text: "离开"
        outcome: null

  - id: wounded_adventurer
    name: "受伤冒险者"
    description: "一名受伤的冒险者倒在路旁，向你求助。"
    choices:
      - text: "救助他（消耗一个治疗道具）"
        condition: "has_healing_potion"
        outcome:
          consume: healing_potion
          reward: random_card
      - text: "给予25金币帮助他"
        condition: "gold >= 25"
        outcome:
          gold: -25
          reward:
            type: gold
            amount_min: 50
            amount_max: 100
      - text: "置之不理（获得少量金币）"
        outcome:
          gold: 10
