relics:
  - id: thornmail
    name: "荆棘铠甲"
    rarity: common
    description: "受到攻击时反弹10%伤害"
    effects:
      - trigger: "on_damaged"
        effect_type: "reflect_damage"
        value: 0.1

  - id: lifestone
    name: "生命石"
    rarity: common
    description: "生命值上限+30"
    effects:
      - trigger: "on_pickup"
        effect_type: "max_health_bonus"
        value: 30

  - id: vampiric_ring
    name: "吸血戒指"
    rarity: rare
    description: "普通攻击吸取造成伤害的15%为生命值"
    effects:
      - trigger: "on_deal_damage"
        effect_type: "lifesteal"
        value: 0.15

  - id: blood_desire
    name: "血之渴望"
    rarity: epic
    description: "暴击吸血30%"
    effects:
      - trigger: "on_crit"
        effect_type: "lifesteal"
        value: 0.3

  - id: phoenix_feather
    name: "凤凰之羽"
    rarity: legendary
    description: "死亡时满血复活（每局一次）"
    effects:
      - trigger: "on_death"
        effect_type: "revive_full_hp"
        value: 1
        condition: "not_used_this_run"
