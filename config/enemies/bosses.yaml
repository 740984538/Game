bosses:
  - id: bone_king
    name: "骸骨之王"
    floor: 1
    phases:
      - phase: 1
        hp_threshold: 1.0    # 100% ~ 70%
        description: "基础攻击模式"
        skills:
          - id: "bone_smash"
            description: "重锤攻击，范围较小"
            cooldown: 3.0
      - phase: 2
        hp_threshold: 0.7    # 70% ~ 30%
        description: "新增骷髅召唤，攻击频率提升"
        skills:
          - id: "summon_minions"
            description: "召唤2只骷髅战士"
            cooldown: 5.0
          - id: "bone_storm"
            description: "骨刺旋转攻击"
            cooldown: 4.0
      - phase: 3
        hp_threshold: 0.3    # 30% ~ 死亡
        description: "狂暴模式，全屏骨刺"
        skills:
          - id: "bone_rain"
            description: "全屏骨刺落下"
            cooldown: 2.0
    drop_table:
      gold_min: 100
      gold_max: 150
      essence: 3
      relic_choices: 3       # 提供3选1遗物

  - id: void_overlord
    name: "虚空霸主"
    floor: 5
    phases:
      - phase: 1
        hp_threshold: 1.0
        description: "虚空冲击波"
        skills:
          - id: "void_wave"
            description: "横向冲击波"
            cooldown: 2.5
      - phase: 2
        hp_threshold: 0.7
        description: "召唤虚空裂缝"
        skills:
          - id: "void_rift"
            description: "地面生成虚空陷阱"
            cooldown: 4.0
      - phase: 3
        hp_threshold: 0.3
        description: "狂暴：全屏混沌攻击"
        skills:
          - id: "chaos_barrage"
            description: "随机方向密集投射物"
            cooldown: 1.5
    drop_table:
      gold_min: 300
      gold_max: 500
      essence: 10
      relic_choices: 3
